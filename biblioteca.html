<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca Digital | Dragão do Mar</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #050505;
      --bg-card: #0f0f14;
      --border-soft: #1f1f2a;
      --primary: #00d4ff;
      --accent: #ffcc00;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #0b1220, #050505 60%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-voltar {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-soft);
      transition: all .3s ease;
    }
    .btn-voltar:hover {
      background: var(--primary);
      color: #000;
    }

    .card {
      width: 92%;
      max-width: 460px;
      background: linear-gradient(180deg, #12121a, #0b0b10);
      border: 1px solid var(--border-soft);
      border-radius: 22px;
      padding: 40px 35px;
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
      animation: rise .8s ease;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0 0 25px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1.9rem;
      font-weight: 900;
      background: linear-gradient(90deg, #fff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    label {
      display: block;
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: .03em;
    }

    select {
      width: 100%;
      margin-top: 8px;
      padding: 14px 14px;
      border-radius: 12px;
      background: #0b0b14;
      border: 1px solid var(--border-soft);
      color: #fff;
      font-size: 0.95rem;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
      transition: all .3s ease;
    }

    select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0,212,255,.25);
    }

    button {
      margin-top: 35px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: .08em;
      background: linear-gradient(135deg, var(--accent), #ffe066);
      color: #000;
      transition: transform .3s ease, box-shadow .3s ease;
    }

    button:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(255,204,0,.35);
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .footer span { color: var(--primary); font-weight: 700; }
  </style>
</head>
<body>

  <a href="index.html" class="btn-voltar"><i class="fas fa-arrow-left"></i> Início</a>

  <div class="card">
    <h1><i class="fas fa-book-open"></i> Biblioteca Digital</h1>

    <label>Disciplina</label>
    <select id="disciplina">
      <option value="Português">Português</option>
      <option value="Redação">Redação</option>
      <option value="Matemática">Matemática</option>
      <option value="Artes">Artes</option>
      <option value="Educação Física">Educação Física</option>
      <option value="Física">Física</option>
      <option value="Biologia">Biologia</option>
      <option value="Química">Química</option>
      <option value="História">História</option>
      <option value="Geografia">Geografia</option>
      <option value="Filosofia">Filosofia</option>
      <option value="Sociologia">Sociologia</option>
      <option value="Inglês">Inglês</option>
      <option value="Espanhol">Espanhol</option>
    </select>

    <label>Série / Nível</label>
    <select id="serie">
      <option value="fundamental">Ensino Fundamental</option>
      <option value="1ano">1º Ano Médio</option>
      <option value="2ano">2º Ano Médio</option>
      <option value="3ano">3º Ano Médio</option>
    </select>

    <button onclick="acessarPDF()">VER MATERIAIS</button>

    <div class="footer">EEMTI Dragão do Mar 2026 · <span>powered by LEI</span></div>
  </div>

  <script>
    function acessarPDF() {
      const d = document.getElementById('disciplina').value;
      const s = document.getElementById('serie').value;
      // Navega para a lista enviando os dados via URL
      window.location.href = `lista.html?serie=${s}&disciplina=${d}`;
    }
  </script>
</body>
</html>
